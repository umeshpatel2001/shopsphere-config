server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/orderdb
    username: myuser
    password: mypassword

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"